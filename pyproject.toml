[project]
name = "flat-hunt"
version = "0.2.0"
description = "Пошук оренди квартири у Львові: збір із кількох джерел, LLM-розбір описів, оцінка й сповіщення в Telegram"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    # Cloudflare на OLX фільтрує за TLS-відбитком — потрібна підміна під Chrome
    "curl-cffi>=0.7.4",
    "requests>=2.32.3",
    # Спільний стан між VPS і локальними запусками
    "pymongo>=4.10",
    # перцептивний хеш фото для дедуплікації
    "pillow>=11.0",
]

[project.scripts]
flat-hunt = "flathunt.cli:main"

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.0"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flathunt"]

[tool.ruff]
line-length = 110
